<nav class="sidebar">
  <div class="logo">claw</div>
  <ul class="chat-list">
    {% for chat in chats %}
    <li>
      <a class="chat-link{% if chat.active %} chat-link--active{% endif %}"
         href="/chats/{{ chat.platform_id }}" data-chat="{{ chat.platform_id }}">
        <span class="chat-dot"></span><span class="chat-name">{{ chat.label }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
  <form class="new-chat" method="post" action="/chats">
    <input name="name" placeholder="+ new chat" required autocomplete="off">
  </form>
  {% if !archived.is_empty() %}
  <details class="archived">
    <summary>archived ({{ archived.len() }})</summary>
    <ul class="chat-list">
      {% for chat in archived %}
      <li>
        <a class="chat-link chat-link--muted{% if chat.active %} chat-link--active{% endif %}"
           href="/chats/{{ chat.platform_id }}">
          <span class="chat-name">{{ chat.label }}</span>
        </a>
      </li>
      {% endfor %}
    </ul>
  </details>
  {% endif %}
  <a class="admin-back" href="/admin/endpoints">⚙ admin</a>
</nav>
