<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>claw — login</title>
  <link rel="icon" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/assets/claw.css">
</head>
<body class="login-page">
  <main class="login-card">
    <h1 class="logo">claw</h1>
    {% if error %}<p class="login-error">invalid token</p>{% endif %}
    <form method="post" action="/login">
      <input type="password" name="token" placeholder="access token" autofocus autocomplete="off">
      <button type="submit">login</button>
    </form>
  </main>
</body>
</html>
