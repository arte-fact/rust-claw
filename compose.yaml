# claw — one Rust daemon, one persistent volume.
# Configuration lives in .env (copy .env.example → .env). With no CLAW_AUTH_TOKEN
# set, a token is generated on first start and printed to the logs (and saved to
# /data/auth_token). Find it with: docker compose logs claw
services:
  claw:
    build: .
    image: claw:latest
    env_file: .env
    ports:
      - "${CLAW_PORT:-8080}:${CLAW_PORT:-8080}"
    volumes:
      - claw-data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: "host"

volumes:
  claw-data:
